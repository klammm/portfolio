    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://klam.space/og-image.jpg" />

    <!--
      Theme-flash guard: runs BEFORE React mounts, so <html data-theme="...">
      is already correct on the very first paint. Without this, useTheme's
      useEffect wouldn't run until after the first render, and you'd see a
      flash of the wrong theme on every load.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var theme =
            saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
